<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c2333"/>
      <stop offset="100%" style="stop-color:#0f1520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#63b3ed"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Accent bar top -->
  <rect width="1200" height="4" fill="url(#accent)"/>

  <!-- Logo area -->
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#63b3ed" letter-spacing="4">NEXT2ME GROUP</text>
  <text x="80" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="white" letter-spacing="-2">Next2<tspan fill="#63b3ed">View</tspan></text>
  <text x="80" y="260" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#a8b0c4">CEO Command Center</text>

  <!-- Divider -->
  <rect x="80" y="300" width="120" height="3" fill="url(#accent)" rx="2"/>

  <!-- Description -->
  <text x="80" y="360" font-family="Arial, sans-serif" font-size="20" fill="#718096">Real-time project intelligence for the Next2me Group.</text>
  <text x="80" y="395" font-family="Arial, sans-serif" font-size="20" fill="#718096">Track progress, financials, and team performance.</text>

  <!-- KPI Cards -->
  <rect x="80" y="450" width="160" height="80" rx="10" fill="rgba(99,179,237,0.1)" stroke="rgba(99,179,237,0.2)" stroke-width="1"/>
  <text x="160" y="485" font-family="Arial, sans-serif" font-size="11" fill="#63b3ed" text-anchor="middle" letter-spacing="1">PROJECTS</text>
  <text x="160" y="515" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#63b3ed" text-anchor="middle">12</text>

  <rect x="260" y="450" width="160" height="80" rx="10" fill="rgba(5,150,105,0.1)" stroke="rgba(5,150,105,0.2)" stroke-width="1"/>
  <text x="340" y="485" font-family="Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" letter-spacing="1">FINANCE</text>
  <text x="340" y="515" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#059669" text-anchor="middle">4</text>

  <rect x="440" y="450" width="160" height="80" rx="10" fill="rgba(217,119,6,0.1)" stroke="rgba(217,119,6,0.2)" stroke-width="1"/>
  <text x="520" y="485" font-family="Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" letter-spacing="1">LEGAL</text>
  <text x="520" y="515" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#d97706" text-anchor="middle">3</text>

  <rect x="620" y="450" width="160" height="80" rx="10" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="700" y="485" font-family="Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" letter-spacing="1">DEV</text>
  <text x="700" y="515" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#7c3aed" text-anchor="middle">5</text>

  <!-- Right side Gantt preview -->
  <rect x="820" y="80" width="320" height="480" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="980" y="115" font-family="Arial, sans-serif" font-size="12" fill="#5a6478" text-anchor="middle" letter-spacing="1">PROJECT TIMELINE</text>

  <!-- Gantt bars -->
  <rect x="900" y="140" width="180" height="18" rx="4" fill="rgba(99,179,237,0.6)"/>
  <rect x="900" y="168" width="120" height="18" rx="4" fill="rgba(99,179,237,0.4)"/>
  <rect x="960" y="196" width="140" height="18" rx="4" fill="rgba(5,150,105,0.6)"/>
  <rect x="900" y="224" width="200" height="18" rx="4" fill="rgba(217,119,6,0.6)"/>
  <rect x="920" y="252" width="160" height="18" rx="4" fill="rgba(124,58,237,0.6)"/>
  <rect x="900" y="280" width="100" height="18" rx="4" fill="rgba(124,58,237,0.4)"/>
  <rect x="940" y="308" width="140" height="18" rx="4" fill="rgba(219,39,119,0.6)"/>
  <rect x="900" y="336" width="180" height="18" rx="4" fill="rgba(5,150,105,0.4)"/>

  <!-- Today line -->
  <line x1="1000" y1="130" x2="1000" y2="480" stroke="#63b3ed" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- URL -->
  <text x="80" y="600" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">www.next2view.com</text>
</svg>