name: Backend CI/CD

on:
  push:
    branches: [ develop, staging ]
    paths: [ 'backend/**' ]
  pull_request:
    branches: [ main, staging ]
    paths: [ 'backend/**' ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: next2view_test
          POSTGRES_USER: next2view
          POSTGRES_PASSWORD: testpass123
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build & Test
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/next2view_test
          DB_USERNAME: next2view
          DB_PASSWORD: testpass123
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          AZURE_KEYVAULT_URI: https://dummy.vault.azure.net
          AZURE_STORAGE_ACCOUNT: dummy
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          SPRING_PROFILES_ACTIVE: test
        run: mvn clean verify -B -DskipTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/

