name: Backend CI/CD

on:
  push:
    branches: [ develop, staging ]
    paths: [ 'backend/**' ]
  pull_request:
    branches: [ main, staging ]
    paths: [ 'backend/**' ]

env:
  ACR_REGISTRY: next2viewdevacr.azurecr.io
  IMAGE_NAME: next2view-api
  CONTAINER_APP: next2view-api
  RESOURCE_GROUP: next2view-rg

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: next2view_test
          POSTGRES_USER: next2view
          POSTGRES_PASSWORD: testpass123
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/next2view_test
          DB_USERNAME: next2view
          DB_PASSWORD: testpass123
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          AZURE_KEYVAULT_URI: https://dummy.vault.azure.net
          AZURE_STORAGE_ACCOUNT: dummy
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          SPRING_PROFILES_ACTIVE: test
        run: mvn clean verify -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/

      - name: Set image tag
        if: github.event_name == 'push'
        id: tag
        run: echo "TAG=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Log in to ACR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.TAG }}
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Azure Container Apps
        if: github.event_name == 'push'
        run: |
          az login --service-principal \
            -u ${{ secrets.AZURE_CLIENT_ID }} \
            -p ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ steps.tag.outputs.TAG }}