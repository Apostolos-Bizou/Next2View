name: Frontend CI

on:
  push:
    branches: [ develop, staging ]
    paths: [ 'frontend/**' ]
  pull_request:
    branches: [ main, staging ]
    paths: [ 'frontend/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://next2view-api.politefield-8c14abcc.northeurope.azurecontainerapps.io/api
        run: npm run build