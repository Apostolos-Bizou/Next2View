name: Backend Deploy

on:
  push:
    branches: [ main ]
    paths: [ 'backend/**' ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        working-directory: backend
        run: mvn clean package -DskipTests -B

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: next2viewdevacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            next2viewdevacr.azurecr.io/next2view-api:latest
            next2viewdevacr.azurecr.io/next2view-api:${{ github.sha }}

      - name: Deploy to Container App
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            az login --service-principal \
              -u ${{ secrets.AZURE_CLIENT_ID }} \
              -p ${{ secrets.AZURE_CLIENT_SECRET }} \
              --tenant ${{ secrets.AZURE_TENANT_ID }}
            az containerapp update \
              --name next2view-api \
              --resource-group next2view-rg \
              --image next2viewdevacr.azurecr.io/next2view-api:${{ github.sha }}