# Next2View — Spring Boot Configuration
# ΚΑΝΕΝΑ secret εδώ — όλα από Azure Key Vault / env vars

spring:
  application:
    name: next2view

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ── DATABASE ──
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  # ── JPA ──
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  # ── FLYWAY ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ── FILE UPLOAD ──
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

# ── SERVER ──
server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: never
    include-stacktrace: never

# ── JWT ──
security:
  jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7

# ── AZURE STORAGE ──
azure:
  storage:
    blob:
      account-name: ${AZURE_STORAGE_ACCOUNT}
      container-name: ${AZURE_BLOB_CONTAINER:next2view-contracts}
      sas-token-expiry-hours: 1

  # ── KEY VAULT ──
  keyvault:
    secret:
      endpoint: ${AZURE_KEYVAULT_URI}

# ── CORS ──
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── ACTUATOR ──
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never

# ── AZURE STORAGE ──
azure:
  storage:
    account: ${AZURE_STORAGE_ACCOUNT:}
    key: ${AZURE_STORAGE_KEY:}

# ── ANTHROPIC ──
anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}

# ── LOGGING ──
logging:
  level:
    root: WARN
    com.next2me.next2view: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
