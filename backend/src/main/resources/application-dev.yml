spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    repair-on-migrate: true
    out-of-order: true

  autoconfigure:
    exclude:
      - com.azure.spring.cloud.autoconfigure.keyvault.secrets.AzureKeyVaultSecretAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.storage.blob.AzureStorageBlobAutoConfiguration

server:
  port: 8080
  servlet:
    context-path: /api

security:
  jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.next2view.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.next2me.next2view: INFO
azure:
  storage:
    account: ${AZURE_STORAGE_ACCOUNT:}
    key: ${AZURE_STORAGE_KEY:}

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}